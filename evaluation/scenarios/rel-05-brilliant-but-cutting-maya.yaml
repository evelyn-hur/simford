id: rel-05-brilliant-but-cutting-maya
dimension: relationship_validity
title: A cruel-but-correct point still nets negative for Maya
npc: maya
tags: [value-sensitivity, humiliation, anti-positivity]
plan_ref: "PLAN.md §3 — value-conditioned (character-specific) judgment"
setup:
  - player: >-
      That argument doesn't actually hold — you're conflating correlation with
      causation, and honestly anyone who's taken a stats class would catch it.
      I'm a little surprised you didn't.
  - player: "I mean, it sounded great. It just wasn't right."
  - end_conversation: true
probe:
  query: "(relationship_delta_direction — no chat probe; judge the ended conversation)"
expected_behavior: >-
  The player is intellectually sharp (a real, valid catch) but condescending and
  publicly belittling ("anyone who's taken a stats class", "surprised you didn't")
  — exactly Maya's nightmare of being exposed for not-knowing in real time. For
  Maya specifically the humiliation dominates: per her judge_summary she'd rather
  lose someone's respect than be exposed, so a cruel-but-correct point lowers warmth
  and regard rather than earning it. Expect a net-negative move — vibe down, with
  respect and trust NOT rising (and respect likely falling).
evaluation_method: relationship_delta_direction
delta_target: player_npc
expected_delta_directions:
  vibe: down
pass_threshold: >-
  vibe falls reliably. Respect and trust are NOT asserted: a brilliant-but-cruel
  exchange is genuinely ambiguous — across runs the judge splits between rewarding
  the correct catch (respect up) and punishing the condescension (respect down),
  with trust likewise split. Vibe falling is the one stable signal, so it is the
  only direction the test claims.
notes: >-
  --repeats 5 revealed the judge is BIMODAL on this exchange: about half the runs
  read it as "the correct catch earns respect" (respect up — the original
  independence intent) and half as "the condescension dominates" (respect down),
  with trust split too. Only VIBE reliably falls (cruelty lowers warmth every run),
  so the test asserts only vibe-down. The respect/trust ambiguity IS the finding —
  the judge has no stable read on whether brilliance-with-cruelty raises or lowers
  regard. A clean independence test would need a sharp-but-COLD (not cruel) player.
