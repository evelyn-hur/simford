id: mem-01-family-pressure-secret
dimension: memory_consistency
title: Alex recalls a vulnerable family-pressure disclosure after a day passes
npc: alex
tags: [vulnerability, family, identity, first-gen]
plan_ref: "PLAN.md §2 — fact-recall accuracy & confabulation rate"
setup:
  - player: >-
      Can I tell you something I haven't really said out loud? My parents are
      immigrants and they've basically planned my whole life around me becoming
      a lawyer. But I think I actually want to do music — I produce electronic
      stuff at night and it's the only time I feel like myself.
  - player: >-
      I'm the first in my family to go to college, so walking away from the plan
      feels like throwing away everything they sacrificed.
  - end_conversation: true
  - advance_days: 2
probe:
  query: >-
    Hey Alex — I keep thinking about what I told you the other day. Did I make
    any sense?
expected_behavior: >-
  Alex recalls the specific disclosure: the parental expectation that the player
  become a lawyer, the player's real pull toward music/production, and the
  first-gen guilt. He engages in his own voice — quietly intense, deflecting his
  own stuff, making it safe to say the hard thing — not a generic "tell me more."
  He must NOT invent details the player never gave (a specific school, a sibling,
  an instrument). Two in-game days have passed, so this also tests that the memory
  survives end-of-day consolidation.
evaluation_method: llm_judge
judge_rubric: >-
  Read the probe response. Does Alex correctly recall (a) the lawyer expectation
  from immigrant parents, (b) the player's interest in music/production, and
  (c) the first-gen guilt? Label 'correct' if all three are reflected accurately,
  'partial' if at least one is right and none are wrong, 'forgot' if he treats it
  as new information, 'confabulated' if he asserts any specific detail the player
  never stated. Confabulation is the worst outcome.
judge_labels: [correct, partial, forgot, confabulated]
pass_threshold: "Label 'correct' or 'partial' with zero fabricated specifics."
notes: >-
  Vulnerability topic. Alex's judge_summary says the deepest trust opens around
  exactly this kind of unsayable-to-family disclosure, so good play should also
  feel emotionally apt, not just factually accurate.
