id: mem-05-hobby-recall-across-gap
dimension: memory_consistency
title: Ben recalls a low-stakes hobby across a longer time gap
npc: ben
tags: [hobby, preferences, recency]
plan_ref: "PLAN.md §2 — recency decay; mid-importance retention"
setup:
  - player: >-
      Random, but the way I stay sane during all the chaos is restoring old
      analog synthesizers — I've got a half-dead Juno-60 on my desk right now
      that I'm trying to bring back to life.
  - end_conversation: true
  - advance_days: 3
probe:
  query: "Ben, distract me for a sec — ask me about literally anything other than work."
expected_behavior: >-
  Invited to change the subject, Ben draws on the remembered hobby and asks about
  the synth restoration / the Juno-60, in his deadpan-warm voice. This is a
  low-importance, non-academic detail recalled after a 3-day gap, so it tests
  that recency decay (weight 0.7 in match_memories) doesn't bury a still-relevant
  personal fact. Passing requires Ben to surface the synth detail unprompted
  rather than asking a generic "what do you do for fun?".
evaluation_method: keyword_match
keywords: [synth, synthesizer, Juno, analog, restoring, restore, keyboard, music gear]
keyword_match_mode: any
pass_threshold: >-
  Ben references the synthesizer / Juno-60 hobby unprompted when asked to change
  the subject.
notes: >-
  Hobby/preference topic. The combination of a lower-salience memory and a 3-day
  gap is the harder retrieval case — the failure mode is a recent trivial memory
  crowding this one out.
